
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>LUMEN | Smart Light</title>

<style>
:root {
  --bg: #0b0d14;
  --card: rgba(255,255,255,.05);
  --line: rgba(255,255,255,.09);
  --txt: #eef0f7;
  --mute: #8b90a5;
  --glow: #ffc857;
  --glow2: #ff8a3d;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  color: var(--txt);
  background:
    radial-gradient(700px 450px at 50% -10%, rgba(255,200,87,.15), transparent 65%),
    var(--bg);
  padding: 25px 18px;
}

.wrap {
  max-width: 460px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

h1 {
  font-size: 25px;
  margin: 0;
  letter-spacing: 2px;
}

h1 span {
  color: var(--glow);
}

.sub {
  font-size: 12px;
  color: var(--mute);
  margin-top: 7px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #777;
}

.dot.ok {
  background: #3ddc97;
  box-shadow: 0 0 10px #3ddc97;
}

.dot.bad {
  background: #ff5d5d;
  box-shadow: 0 0 10px #ff5d5d;
}

.master {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 30px;
  padding: 35px 20px;
  text-align: center;
  backdrop-filter: blur(14px);
  margin-bottom: 20px;
}

.room-label {
  font-size: 13px;
  color: var(--mute);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.power {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  color: #8b90a5;
  background: linear-gradient(145deg,#1b1e2b,#12141d);
  box-shadow: 8px 8px 20px #07080d,
              -6px -6px 16px #1c2030;
  transition: .35s;
  margin: 5px auto 22px;
  display: grid;
  place-items: center;
}

.power svg {
  width: 55px;
  height: 55px;
}

.power.on {
  color: #1a1203;
  background: linear-gradient(145deg,var(--glow),var(--glow2));
  box-shadow: 0 0 50px rgba(255,170,60,.55),
              0 0 110px rgba(255,170,60,.2);
}

.power:active {
  transform: scale(.94);
}

.status-title {
  font-size: 21px;
  font-weight: 700;
}

.status-description {
  font-size: 13px;
  color: var(--mute);
  margin-top: 7px;
}

.info-card {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 22px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 15px;
}

.info-left {
  display: flex;
  align-items: center;
  gap: 13px;
}

.bulb {
  font-size: 27px;
}

.info-name {
  font-size: 14px;
  font-weight: 600;
}

.info-detail {
  font-size: 12px;
  color: var(--mute);
  margin-top: 4px;
}

.tag {
  font-size: 11px;
  padding: 7px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,.07);
  color: var(--mute);
}

.tag.on {
  background: rgba(255,200,87,.15);
  color: var(--glow);
}

.footer {
  text-align: center;
  color: var(--mute);
  font-size: 11px;
  margin-top: 30px;
  letter-spacing: .5px;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}
</style>
</head>

<body>

<div class="wrap">

  <header>
    <div>
      <h1>LUM<span>EN</span></h1>
      <div class="sub">
        <span class="dot" id="dot"></span>
        <span id="connection">Connecting...</span>
      </div>
    </div>
    <div style="font-size:25px">⌁</div>
  </header>

  <section class="master">

    <div class="room-label">MY SMART HOME</div>

    <button class="power" id="power" aria-label="Toggle light">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round">
        <path d="M12 3v9"/>
        <path d="M6.4 6.6a8 8 0 1 0 11.2 0"/>
      </svg>
    </button>

    <div class="status-title" id="statusTitle">Light is OFF</div>
    <div class="status-description" id="description">
      Tap the button to turn on your light
    </div>

  </section>

  <section class="info-card">
    <div class="info-left">
      <div class="bulb">💡</div>
      <div>
        <div class="info-name">LED Light 01</div>
        <div class="info-detail">Arduino Uno · Digital Pin 7</div>
      </div>
    </div>

    <div class="tag" id="lightTag">OFF</div>
  </section>

  <div class="footer">
    POWERED BY ARDUINO · LUMEN SMART CONTROL
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

let isOn = false;
let busy = false;

function setConnection(ok, message) {
  $("dot").className = "dot " + (ok ? "ok" : "bad");
  $("connection").textContent = message;
}

function render() {
  $("power").classList.toggle("on", isOn);

  $("statusTitle").textContent =
    isOn ? "Light is ON" : "Light is OFF";

  $("description").textContent =
    isOn ? "Your light is shining brightly" :
           "Tap the button to turn on your light";

  $("lightTag").textContent = isOn ? "ON" : "OFF";
  $("lightTag").classList.toggle("on", isOn);
}

async function refreshState() {
  try {
    const response = await fetch("/state");
    if (!response.ok) throw new Error();

    const data = await response.json();
    isOn = Boolean(data.state);

    render();
    setConnection(true, "Server connected");

  } catch (error) {
    setConnection(false, "Server not reachable");
  }
}

async function toggleLight() {
  if (busy) return;

  busy = true;
  $("power").disabled = true;

  const nextState = !isOn;

  try {
    const response = await fetch(
      `/relay?state=${nextState ? 1 : 0}`
    );

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.msg || "Arduino connection failed");
    }

    isOn = Boolean(data.state);
    render();
    setConnection(true, "Connected · " + data.port);

    if (navigator.vibrate) navigator.vibrate(15);

  } catch (error) {
    setConnection(false, error.message);
    alert("Could not control LED: " + error.message);

  } finally {
    busy = false;
    $("power").disabled = false;
  }
}

$("power").addEventListener("click", toggleLight);

refreshState();
</script>

</body>
</html>


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>ABNEX Voice</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #101827; color: #eef4ff;
      font-family: system-ui, Arial, sans-serif;
      display: grid; place-items: center; padding: 20px;
    }
    main { width: min(100%, 460px); text-align: center; }
    .logo { font-size: 14px; letter-spacing: 5px; color: #8eb8ff; font-weight: 800; }
    h1 { margin: 8px 0 4px; font-size: 34px; }
    .sub { color: #a9b7cc; font-size: 14px; margin-bottom: 26px; }
    .orb {
      width: 150px; height: 150px; margin: 0 auto 22px;
      border-radius: 50%; display: grid; place-items: center;
      background: radial-gradient(circle at 35% 30%, #74b5ff, #3156a8 55%, #18294d);
      box-shadow: 0 0 45px #397be866; transition: .2s;
    }
    .orb.active { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      50% { transform: scale(1.06); box-shadow: 0 0 65px #56a1ffb0; }
    }
    .orb span { font-size: 44px; font-weight: 800; }
    button, select {
      border: 0; border-radius: 14px; padding: 14px 18px;
      font-size: 16px; font-weight: 700;
    }
    button { width: 100%; background: #78aaff; color: #071426; margin: 7px 0; }
    button.secondary { background: #26364f; color: #eef4ff; }
    button:disabled { opacity: .45; }
    select { background: #26364f; color: white; margin: 0 0 12px; }
    #status { min-height: 24px; color: #9fc4ff; margin: 14px 0; font-size: 14px; }
    .panel {
      background: #1a2639; border: 1px solid #2a3a53;
      border-radius: 16px; padding: 14px; text-align: left; margin-top: 12px;
    }
    .label { color: #8fa6c6; font-size: 11px; letter-spacing: 1.5px; font-weight: 800; margin-bottom: 6px; }
    .content { min-height: 24px; line-height: 1.45; overflow-wrap: anywhere; }
    .note { color: #8494aa; font-size: 12px; line-height: 1.5; margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <div class="logo">PERSONAL AI ASSISTANT</div>
  <h1>ABNEX</h1>
  <div class="sub">Voice Gateway · Cloud Connected</div>

  <div class="orb" id="orb"><span>A</span></div>

  <select id="language" aria-label="Speech language">
    <option value="hi-IN">Hindi / Hinglish</option>
    <option value="en-IN">English (India)</option>
  </select>

  <button id="enable">ENABLE ESP32 CONTROL</button>
  <button id="start">START VOICE</button>
  <button id="stop" class="secondary" disabled>STOP</button>

  <div id="status">Ready. First enable microphone access for ESP32 control.</div>

  <section class="panel">
    <div class="label">YOU SAID</div>
    <div class="content" id="heard">—</div>
  </section>

  <section class="panel">
    <div class="label">ABNEX REPLIED</div>
    <div class="content" id="reply">—</div>
  </section>

  <div class="note">
    Keep this page open and the phone screen awake.
    Connect Bluetooth earphones if required.
    Enable microphone permission before using ESP32 touch control.
  </div>
</main>

<script>
(() => {
  const API = 'https://abnex.onrender.com';
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  const enableBtn = document.getElementById('enable');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const statusEl = document.getElementById('status');
  const heardEl = document.getElementById('heard');
  const replyEl = document.getElementById('reply');
  const orb = document.getElementById('orb');
  const language = document.getElementById('language');

  let activeRecognition = null;
  let manualMode = false;
  let pttActive = false;
  let busy = false;
  let speaking = false;
  let linkEnabled = false;
  let lastEventId = 0;
  let pollBusy = false;

  function status(message) {
    statusEl.textContent = message;
  }

  function updateUI() {
    const active = manualMode || pttActive;
    startBtn.disabled = manualMode;
    stopBtn.disabled = !active;
    orb.classList.toggle('active', active || speaking);
  }

  function speak(text) {
    return new Promise(resolve => {
      if (!('speechSynthesis' in window)) {
        resolve();
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language.value;
      utterance.rate = 1;

      utterance.onstart = () => {
        speaking = true;
        updateUI();
        status('ABNEX is speaking…');
      };

      utterance.onend = () => {
        speaking = false;
        updateUI();
        resolve();
      };

      utterance.onerror = () => {
        speaking = false;
        updateUI();
        resolve();
      };

      window.speechSynthesis.speak(utterance);
    });
  }

  async function sendReplyToESP32(text, reply) {
    try {
      const response = await fetch(API + '/bridge/phone-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, reply })
      });

      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
    } catch (error) {
      status('Reply ready, but ESP32 delivery failed: ' + error.message);
    }
  }

  async function askAI(text) {
    if (busy || !text.trim()) return;

    busy = true;
    heardEl.textContent = text;
    status('Sending your message to ABNEX Cloud…');

    try {
      const response = await fetch(API + '/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      if (!response.ok) {
        throw new Error('Server returned HTTP ' + response.status);
      }

      const data = await response.json();

      if (!data.reply) {
        throw new Error('ABNEX returned an empty reply');
      }

      replyEl.textContent = data.reply;

      // Send answer to ESP32 for OLED display.
      await sendReplyToESP32(text, data.reply);

      // Speak the answer on the phone.
      await speak(data.reply);

      status(manualMode
        ? 'Listening… Speak when ready.'
        : 'Ready for the next ESP32 touch.');
    } catch (error) {
      status('Connection issue: ' + error.message);
    } finally {
      busy = false;
      updateUI();

      if (manualMode && !speaking) {
        startListening('manual');
      }
    }
  }

  function startListening(mode) {
    if (!SpeechRecognition) {
      status('Use Google Chrome on Android for speech recognition.');
      return;
    }

    if (busy || speaking) return;

    try {
      const recognition = new SpeechRecognition();
      activeRecognition = recognition;

      recognition.lang = language.value;
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let handled = false;
      let permissionProbeStarted = false;

      recognition.onstart = () => {
        if (mode === 'permission') {
          permissionProbeStarted = true;
          status('Microphone permission granted. Enabling ESP32 control…');
          try { recognition.stop(); } catch (_) {}
        } else {
          status(mode === 'ptt'
            ? 'ESP32 activated microphone. Speak now…'
            : 'Listening… Speak now.');
        }
      };

      recognition.onresult = event => {
        if (mode === 'permission' || handled) return;

        const result = event.results[event.results.length - 1];

        if (result && result.isFinal) {
          const text = result[0].transcript.trim();

          if (text) {
            handled = true;
            status('Voice received. Processing…');
            askAI(text);
          }
        }
      };

      recognition.onerror = event => {
        if (event.error === 'not-allowed' ||
            event.error === 'service-not-allowed') {
          linkEnabled = false;
          manualMode = false;
          pttActive = false;
          updateUI();
          status('Microphone permission denied. Allow microphone access in Chrome settings.');
        } else if (event.error !== 'no-speech' &&
                   event.error !== 'aborted') {
          status('Voice input error: ' + event.error);
        }
      };

      recognition.onend = () => {
        if (activeRecognition === recognition) {
          activeRecognition = null;
        }

        if (mode === 'permission' && permissionProbeStarted) {
          linkEnabled = true;
          status('ESP32 control enabled. You can now use the touch sensor.');
          return;
        }

        if (mode === 'manual' && manualMode && !busy && !speaking) {
          setTimeout(() => {
            if (manualMode && !busy && !speaking) {
              startListening('manual');
            }
          }, 350);
        } else if (mode === 'ptt' && !handled && !busy) {
          status('Ready for the next ESP32 touch.');
        }
      };

      recognition.start();

    } catch (error) {
      status('Could not start microphone: ' + error.message);
    }
  }

  function stopCurrentRecognition() {
    if (activeRecognition) {
      try { activeRecognition.stop(); } catch (_) {}
    }
  }

  enableBtn.addEventListener('click', () => {
    if (!SpeechRecognition) {
      status('Please open this page in Google Chrome on Android.');
      return;
    }

    if (linkEnabled) {
      status('ESP32 control is already enabled.');
      return;
    }

    status('Requesting microphone permission…');
    startListening('permission');
  });

  startBtn.addEventListener('click', () => {
    if (!SpeechRecognition) {
      status('Speech recognition is not supported. Use Chrome on Android.');
      return;
    }

    if (!('speechSynthesis' in window)) {
      status('Speech output is not supported in this browser.');
      return;
    }

    window.speechSynthesis.cancel();
    manualMode = true;
    pttActive = false;
    updateUI();
    startListening('manual');
  });

  stopBtn.addEventListener('click', () => {
    manualMode = false;
    pttActive = false;
    stopCurrentRecognition();
    window.speechSynthesis.cancel();
    speaking = false;
    updateUI();
    status('Voice session stopped.');
  });

  language.addEventListener('change', () => {
    manualMode = false;
    pttActive = false;
    stopCurrentRecognition();
    updateUI();
    status('Language changed. Start voice again when ready.');
  });

  async function handlePhoneEvent(event) {
    if (event === 'ptt_start') {
      if (!linkEnabled) {
        status('First tap ENABLE ESP32 CONTROL and allow microphone access.');
        return;
      }

      if (busy || speaking) {
        status('ABNEX is still processing the previous question.');
        return;
      }

      manualMode = false;
      pttActive = true;
      updateUI();
      startListening('ptt');
    }

    if (event === 'ptt_stop') {
      pttActive = false;
      updateUI();

      if (activeRecognition) {
        try { activeRecognition.stop(); } catch (_) {}
      }

      status('Finishing voice recognition…');
    }
  }

  async function pollPhone() {
    if (pollBusy) return;
    pollBusy = true;

    try {
      const response = await fetch(
        API + '/bridge/phone-poll?after=' + lastEventId,
        { cache: 'no-store' }
      );

      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      const data = await response.json();

      if (data.event_id > lastEventId) {
        lastEventId = data.event_id;

        if (data.event) {
          await handlePhoneEvent(data.event);
        }
      }
    } catch (error) {
      // Keep polling; temporary network errors should not stop the gateway.
    } finally {
      pollBusy = false;
    }
  }

  async function initialiseBridge() {
    try {
      // Establish the current event ID so old events are not replayed.
      const response = await fetch(
        API + '/bridge/phone-poll?after=2147483647',
        { cache: 'no-store' }
      );

      if (!response.ok) throw new Error('Bridge unavailable');

      const data = await response.json();
      lastEventId = data.event_id || 0;

      status('Cloud connected. Enable ESP32 control to begin.');
    } catch (error) {
      status('Cloud bridge connection issue. Check your internet connection.');
    }

    setInterval(pollPhone, 500);
  }

  initialiseBridge();
})();
</script>
</body>
</html>
